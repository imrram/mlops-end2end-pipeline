name: MLOps e2e CI Pipeline with DockerHub Push

on:
  push:
    branches:
      - main
      - docker_ci
      - quantization

jobs:
  train_model:
    name: Train Model
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run training script
      run: python src/train.py

    - name: Upload trained model
      uses: actions/upload-artifact@v4
      with:
        name: model-artifact
        path: model.joblib


  quantize_model:
    name: Quantization
    runs-on: ubuntu-latest
    needs: train_model

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Download model artifact
      uses: actions/download-artifact@v4
      with:
        name: model-artifact
        path: .

    - name: Run quantization script
      run: python src/quantize.py

    - name: Upload quantized weights
      uses: actions/upload-artifact@v4
      with:
        name: quant-weights
        path: quant_params.joblib


  docker_build_and_push:
    name: Docker Image & Inference
    runs-on: ubuntu-latest
    needs: quantize_model

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Download model artifact
      uses: actions/download-artifact@v4
      with:
        name: model-artifact
        path: .

    - name: Run inference with quantized weights
      run: python src/quantize.py

    - name: Build Docker Image
      run: docker build -t housing-predictor .

    - name: Run Docker container
      run: docker run housing-predictor

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Tag & Push Docker Image
      run: |
        docker tag housing-predictor ${{ secrets.DOCKER_USERNAME }}/housing-predictor:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/housing-predictor:latest
