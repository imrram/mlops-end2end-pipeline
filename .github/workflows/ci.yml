name: MLOps e2e CI Pipeline with DockerHub Push

on:
  push:
    branches: [docker_ci]

jobs:
  build_and_push_container:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Train the model
      run: python src/train.py

    - name: Build Docker image
      run: docker build -t housing-predictor .

    - name: Run Docker container
      run: docker run housing-predictor

    - name: Tag Docker image for DockerHub
      run: docker tag housing-predictor ${{ secrets.DOCKER_USERNAME }}/housing-predictor:latest

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Push Docker image to DockerHub
      run: docker push ${{ secrets.DOCKER_USERNAME }}/housing-predictor:latest
